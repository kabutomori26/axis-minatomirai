<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="アクセスマップ（プレースホルダー）">
  <rect width="1000" height="700" fill="#f3f6fa" />

  <!-- 街区 -->
  <g fill="#e7edf3">
    <rect x="320" y="280" width="120" height="120" />
    <rect x="470" y="280" width="120" height="120" />
    <rect x="320" y="120" width="120" height="80" />
    <rect x="120" y="300" width="100" height="100" />
    <rect x="760" y="300" width="100" height="100" />
  </g>

  <!-- 道路 -->
  <g stroke="#ffffff" stroke-width="14" fill="none">
    <path d="M0 240 H1000" />
    <path d="M0 470 H1000" />
    <path d="M280 0 V700" />
    <path d="M640 0 V700" />
    <path d="M0 60 L1000 360" />
  </g>

  <!-- 海（みなとみらいらしく） -->
  <path d="M0 560 Q250 520 500 560 T1000 560 V700 H0 Z" fill="#bfe0f4" />
  <path d="M0 560 Q250 520 500 560 T1000 560" stroke="#1e73be" stroke-opacity="0.35" stroke-width="2" fill="none" />

  <!-- 現在地ピン -->
  <g transform="translate(500 360)">
    <circle r="52" fill="#1e73be" fill-opacity="0.1" />
    <path d="M0 -28 C18 -28 30 -15 30 2 C30 24 0 48 0 48 C0 48 -30 24 -30 2 C-30 -15 -18 -28 0 -28 Z" fill="#1e73be" />
    <circle cy="0" r="10" fill="#ffffff" />
  </g>

  <text x="500" y="440" text-anchor="middle" fill="#5e7080" font-family="serif" font-size="22" letter-spacing="3">AXIS Minatomirai</text>
</svg>
